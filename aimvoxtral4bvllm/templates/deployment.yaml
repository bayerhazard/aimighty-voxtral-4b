apiVersion: v1
kind: ConfigMap
metadata:
  name: aimvoxtral4bvllm-transcode
  namespace: {{ .Release.Namespace }}
data:
  tts-transcode.py: |
    #!/usr/bin/env python3
    # TTS WAV -> MP3 transcode proxy.
    # vLLM-Omni Voxtral returns 24kHz WAV, but LiteLLM hardcodes
    # Content-Type: audio/mpeg for OpenAI TTS backends. Re-encode to real MP3
    # so the client/browser decodes correctly.
    import subprocess
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    BACKEND = "http://127.0.0.1:{{ .Values.apiPort }}"

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            if self.path != "/v1/audio/speech":
                self.send_error(404)
                return
            length = int(self.headers.get("Content-Length", 0) or 0)
            body = self.rfile.read(length)
            req = urllib.request.Request(
                BACKEND + "/v1/audio/speech",
                data=body,
                headers={"Content-Type": self.headers.get("Content-Type", "application/json")},
                method="POST",
            )
            try:
                with urllib.request.urlopen(req, timeout=300) as resp:
                    wav = resp.read()
            except Exception:
                self.send_error(502)
                return
            proc = subprocess.run(
                ["ffmpeg", "-loglevel", "error", "-i", "-",
                 "-c:a", "libmp3lame", "-b:a", "128k", "-f", "mp3", "-"],
                input=wav, capture_output=True,
            )
            if proc.returncode == 0 and proc.stdout:
                self.send_response(200)
                self.send_header("Content-Type", "audio/mpeg")
                self.send_header("Content-Length", str(len(proc.stdout)))
                self.end_headers()
                self.wfile.write(proc.stdout)
            else:
                # fallback: pass the original WAV through
                self.send_response(200)
                self.send_header("Content-Type", "audio/wav")
                self.send_header("Content-Length", str(len(wav)))
                self.end_headers()
                self.wfile.write(wav)

        def log_message(self, fmt, *args):
            pass

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", {{ .Values.transcodePort }}), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimvoxtral4bvllm
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimvoxtral4bvllm
spec:
  replicas: {{ .Values.workloads.aimvoxtral4bvllm.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: aimvoxtral4bvllm
  strategy:
    type: {{ .Values.strategy.type }}
  template:
    metadata:
      labels:
        app: aimvoxtral4bvllm
    spec:
      containers:
      # Container 1: vLLM-Omni TTS API
      - name: vllm-server
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["vllm-omni", "serve"]
        args:
          - "$(MODEL_NAME)"
          - "--served-model-name"
          - "$(MODEL_ALIAS)"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--tokenizer-mode"
          - "mistral"
          - "--config-format"
          - "mistral"
          - "--load-format"
          - "mistral"
          - "--omni"
          - "--trust-remote-code"
          - "--download-dir"
          - "/models"
          - "--stage-configs-path"
          - "/etc/vllm-omni/voxtral_tts.yaml"
          - "--gpu-memory-utilization"
          - "0.52"
          - "--kv-cache-memory-bytes"
          - "3221225472"
        env:
          - name: HF_TOKEN
            value: {{ .Values.olaresEnv.HF_TOKEN | default "" | quote }}
          - name: HF_HOME
            value: {{ .Values.env.HF_HOME | quote }}
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"
          - name: GPU_TYPE
            value: "nvidia"
        envFrom:
          - configMapRef:
              name: aimvoxtral4bvllm-env
        ports:
          - containerPort: {{ .Values.apiPort }}
            name: api
        resources:
            {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
          - name: models
            mountPath: /models
          - name: dshm
            mountPath: /dev/shm
          - name: stage-config
            mountPath: /etc/vllm-omni/voxtral_tts.yaml
            subPath: voxtral_tts.yaml
        startupProbe:
            {{- toYaml .Values.startupProbe | nindent 10 }}
        livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 10 }}

      # Container 2: nginx Dashboard
      - name: nginx
        image: "{{ .Values.nginx.image }}"
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: {{ .Values.dashboardPort }}
            name: dashboard
        resources:
            {{- toYaml .Values.nginxResources | nindent 10 }}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: dashboard-html
            mountPath: /usr/share/nginx/html

      # Container 3: WAV -> MP3 transcode proxy for /v1/audio/speech
      # (LiteLLM declares audio/mpeg; vLLM-Omni serves WAV)
      - name: tts-transcode
        image: "{{ .Values.transcode.image }}"
        imagePullPolicy: IfNotPresent
        command:
          - "sh"
          - "-c"
          - "apk add --no-cache ffmpeg >/dev/null 2>&1; python /opt/tts-transcode.py"
        ports:
          - containerPort: {{ .Values.transcodePort }}
            name: transcode
        resources:
            {{- toYaml .Values.transcode.resources | nindent 10 }}
        volumeMounts:
          - name: transcode-script
            mountPath: /opt/tts-transcode.py
            subPath: tts-transcode.py

      volumes:
        - name: models
          hostPath:
            path: {{ .Values.userspace.appData }}/models
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.volumes.dshm.sizeLimit }}
        - name: nginx-config
          configMap:
            name: aimvoxtral4bvllm-dashboard
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: dashboard-html
          configMap:
            name: aimvoxtral4bvllm-dashboard
        - name: stage-config
          configMap:
            name: aimvoxtral4bvllm-stage
            items:
              - key: voxtral_tts.yaml
                path: voxtral_tts.yaml
        - name: transcode-script
          configMap:
            name: aimvoxtral4bvllm-transcode
            items:
              - key: tts-transcode.py
                path: tts-transcode.py
---

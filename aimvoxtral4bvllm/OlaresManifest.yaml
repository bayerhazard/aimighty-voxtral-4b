---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimvoxtral4bvllm: 1

metadata:
  name: aimvoxtral4bvllm
  appid: aimvoxtral4bvllm
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-voxtral-4b/main/icon.png
  description: Voxtral 4B TTS via vLLM-Omni — 20 voices, 10 languages, 24 kHz, OpenAI-compatible API
  title: AIM Voxtral 4B TTS
  version: '26.9.1'
  categories:
    - Audio

entrances:
  - name: aimvoxtral4bvllm
    port: 8080
    host: aimvoxtral4bvllm
    title: AIM Voxtral 4B TTS
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-voxtral-4b/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.9.1'
  upgradeDescription: |
    Initial Release for AImighty Olares One
  fullDescription: |
    **Voxtral-4B-TTS** — Mistral's frontier text-to-speech model, served via vLLM-Omni with optimized resource usage.

    **Model**
    mistralai/Voxtral-4B-TTS-2603 via vLLM-Omni v0.24.0. BF16 precision with 3 GiB KV-Cache reduces VRAM to ~12 GB (vs 20.5 GB default).

    **Inference Engine**
    vLLM-Omni with optimized KV-Cache management. OpenAI-compatible API.

    **Key Features**
    - OpenAI-compatible API: /v1/audio/speech, /v1/models
    - 20 preset voices across 10 languages (EN, FR, ES, DE, IT, PT, NL, AR, HI, JP)
    - 24 kHz audio output
    - Optimized: 3 GiB KV-Cache (--kv-cache-memory-bytes 3221225472) → ~12 GB VRAM
    - Web dashboard for quick testing
    - Unlimited API timeout for long TTS responses

    **Resource Usage**
    GPU: 1× NVIDIA (~12 GB VRAM)
    RAM: 8-16 GB, CPU: 2-8 cores
    Disk: 20 GB (model cache)

    **API Example**
    ```bash
    curl -X POST http://localhost:8000/v1/audio/speech \
      -H "Content-Type: application/json" \
      -d '{"model": "voxtral-tts-4b", "input": "Hello world!", "voice": "neutral_female"}' \
      -o output.wav
    ```

    **Note:** Model weights are CC-BY-NC-4.0 (non-commercial use only).
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-voxtral-4b
  sourceCode: https://github.com/bayerhazard/aimighty-voxtral-4b
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: "2"
  limitedCpu: "8"
  requiredMemory: 12Gi
  limitedMemory: 24Gi
  requiredDisk: 20Gi
  limitedDisk: 50Gi
  requiredGpu: 1

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system

spec:
  versionName: '1.2.1'
  upgradeDescription: |
    v1.2.1: Engine update v0.18.0 -> v0.24.0 (the Olares registry mirror does not
    carry v0.24.1; v0.24.0 is already cached on the nodes and validated). Serving
    via deploy-config (--deploy-config, stages) with max_cudagraph_capture_size 4 +
    gpu_memory_utilization 0.7 for the 24 GB laptop 5090. Transcode sidecar,
    LiteLLM outbound name tts-voxtral, and all Olares 1.12.6 fixes unchanged.
    v1.1.1: Fix garbled TTS through LiteLLM/Open WebUI. LiteLLM hardcodes
    Content-Type audio/mpeg for non-"gemini" OpenAI TTS backends, but vLLM-Omni
    Voxtral serves 24kHz WAV -> WAV bytes decoded as MP3 -> unintelligible.
    Added a WAV->MP3 transcode proxy sidecar (python:3.12-alpine + ffmpeg) in front
    of /v1/audio/speech so LiteLLM's audio/mpeg header is correct. Outbound LiteLLM
    model name stays tts-voxtral; no LiteLLM changes required.
    v1.1.0: Engine rollback vLLM-Omni v0.24.0 -> v0.18.0 (experiment). The v0.24.0
    audio path (per-request cfg_alpha, codes["audio"] extraction, voice applied only
    in prefill step) produced unintelligible-but-speech-shaped audio. v0.18.0 uses
    the pre-refactor path (voice every decode step, "audio" key) with the upstream
    legacy stage-config (stage0 4096/temp 0.0, stage1 65536). Served via
    --stage-configs-path (no deploy-config in v0.18.0). All Olares 1.12.6 fixes
    kept: v3 manifest, no nvidia.com/gpumem, no bytetrade owner label override,
    24Gi memory, HF_TOKEN env wiring.
    v1.0.11: Stability: cap CUDA graph capture size to 4 for the Voxtral deploy
    config (single-request TTS workload). Default captured up to 64 sequences which
    spiked VRAM (~25 GB stage 0) and OOM'd (exit 137) on the 24 GB laptop 5090 during
    cold boot. Keeps CUDA graphs for the real single-request case (sizes [1,2,4]);
    no throughput loss, no cold-boot OOM. Served via a mounted deploy config
    (--deploy-config) so the official sampling (temp 0.0, cfg_alpha 1.2) stays intact.
    v1.0.10: Fixed garbled/unintelligible TTS audio. Explicit CLI args
    (--max-model-len, --kv-cache-memory-bytes, --max-num-seqs) overrode the
    auto-loaded vLLM-Omni Voxtral two-stage deploy config, forcing the audio
    tokenizer stage to max_seq_len 8192 instead of 65536 (audio decode truncated).
    Removed the overrides so the official deploy config (sampling, codec streaming
    connectors) is applied, matching the upstream recipe for Voxtral TTS.
    v1.0.9: Fixed TTS engine crash. max_model_len 512 was too small (Voxtral TTS
    voice-embedding prompt alone is ~557 tokens) -> "could not broadcast input
    array from shape (557,) into shape (512,)" killed the engine on every request.
    Raised to 8192 with 3 GiB KV cache.
    v1.0.8: Raised container memory to 24Gi (16Gi was too tight for the 10.9 GB
    BF16 model + vLLM overhead during weight load -> cgroup OOM kill, exit 137).
    v1.0.7: Removed explicit applications.app.bytetrade.io/owner label from the
    deployment template (was set to the app name, but the GPUBinding podSelector
    expects the Olares user -> pod never matched its binding, GPU scheduler
    reported "insufficient GPUBindings bound=0", pod Unschedulable). Olares
    app-service injects the correct labels at install time.
    v1.0.6: Removed nvidia.com/gpumem resource request (not advertised by Olares
    HAMi device plugin, caused Unschedulable pod). GPU memory is controlled via the
    Olares compute binding instead.
    v1.0.5: Migrated OlaresManifest to apiVersion v3 (required by Olares 1.12.6).
    Fixed replicas to reference .Values.workloads, olares dependency to >=1.12.6-0,
    added HF_TOKEN env wiring. Fixes install rejection ("apiVersion v2 is incompatible
    and cannot be install").
    v1.0.4: Upgraded vLLM-Omni image to v0.24.0 (stable, latest). Contains Voxtral serving fixes + 6 months of engine improvements. Version aligned to 1.0.4 across chart/manifest.
    v1.0.3: Fixed deployment title to 'Voxtral 4B HQ'.
    v1.0.2: Category update — moved to Audio.
    v1.0.1: Fixed OlaresManifest schema (appid, type, entrances), added openMethod: window.
    v1.0.0: Initial release — vLLM-Omni with optimized KV-Cache (3 GiB), ~12 GB VRAM, Web Dashboard.
  fullDescription: |
    **Voxtral-4B-TTS** — Mistral's frontier text-to-speech model, served via vLLM-Omni with optimized resource usage.

    **Model**
    mistralai/Voxtral-4B-TTS-2603 via vLLM-Omni v0.24.0. BF16 precision with 3 GiB KV-Cache reduces VRAM to ~12 GB (vs 20.5 GB default).

    **Inference Engine**
    vLLM-Omni with optimized KV-Cache management. OpenAI-compatible API.

    **Key Features**
    - OpenAI-compatible API: /v1/audio/speech, /v1/models
    - 20 preset voices across 10 languages (EN, FR, ES, DE, IT, PT, NL, AR, HI, JP)
    - 24 kHz audio output
    - Optimized: 3 GiB KV-Cache (--kv-cache-memory-bytes 3221225472) → ~12 GB VRAM
    - Web dashboard for quick testing
    - Unlimited API timeout for long TTS responses

    **Resource Usage**
    GPU: 1× NVIDIA (~12 GB VRAM)
    RAM: 8-16 GB, CPU: 2-8 cores
    Disk: 20 GB (model cache)

    **API Example**
    ```bash
    curl -X POST http://localhost:8000/v1/audio/speech \
      -H "Content-Type: application/json" \
      -d '{"model": "voxtral-tts-4b", "input": "Hello world!", "voice": "neutral_female"}' \
      -o output.wav
    ```

    **Note:** Model weights are CC-BY-NC-4.0 (non-commercial use only).
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-voxtral-4b
  sourceCode: https://github.com/bayerhazard/aimighty-voxtral-4b
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: "2"
  limitedCpu: "8"
  requiredMemory: 12Gi
  limitedMemory: 24Gi
  requiredDisk: 20Gi
  limitedDisk: 50Gi
  requiredGpu: 1

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 0
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
